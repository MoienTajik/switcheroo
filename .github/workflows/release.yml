name: Release

# Publish: push a tag like v1.0.1 (it must match the VERSION file). Tags are restricted to the repo owner.
# Dry run: run this workflow manually (Actions tab) to build, sign, notarize and checksum the DMG
# without publishing anything; the result is attached to the run as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # create the GitHub Release and upload assets
  id-token: write       # sign the build-provenance attestation
  attestations: write   # record it

jobs:
  release:
    runs-on: macos-15
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing secrets
        id: gate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          NOTARY: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          if [ -z "$CERT" ] || [ -z "$NOTARY" ]; then
            echo "Signing secrets are missing — skipping the signed release build."
            echo "Needed: MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, NOTARY_KEY_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag matches VERSION
        if: steps.gate.outputs.ready == 'true' && env.PUBLISH == 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          [ "$tag" = "$file" ] || { echo "Tag v$tag != VERSION ($file)"; exit 1; }

      - name: Install mkcert (bundled into the app for HTTPS rewrites)
        if: steps.gate.outputs.ready == 'true'
        run: brew install mkcert

      - name: Import the Developer ID certificate
        if: steps.gate.outputs.ready == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KP="$(openssl rand -hex 20)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write the notarization API key
        if: steps.gate.outputs.ready == 'true'
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          (umask 077; echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8")

      - name: Build, sign, notarize and staple the DMG
        if: steps.gate.outputs.ready == 'true'
        env:
          SIGN_ID: "Developer ID Application: Simber Tech (BJ7A45T36J)"
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./make-dmg.sh

      - name: Verify the result is notarized and passes Gatekeeper
        if: steps.gate.outputs.ready == 'true'
        run: |
          dmg="$(ls dist/Switcheroo-*.dmg)"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"

      - name: Generate SHA-256 checksums
        if: steps.gate.outputs.ready == 'true'
        run: (cd dist && shasum -a 256 Switcheroo-*.dmg | tee SHA256SUMS.txt)

      - name: Attest build provenance
        if: steps.gate.outputs.ready == 'true' && env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Switcheroo-*.dmg

      - name: Publish the GitHub Release
        if: steps.gate.outputs.ready == 'true' && env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Switcheroo-*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Keep the dry-run build as an artifact
        if: steps.gate.outputs.ready == 'true' && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: switcheroo-dry-run
          path: |
            dist/Switcheroo-*.dmg
            dist/SHA256SUMS.txt
          retention-days: 3
