name: Release

# Push a tag like v1.0.0 (matching the VERSION file) to build, sign, notarize and publish the DMG.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release and upload the DMG

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          [ "$tag" = "$file" ] || { echo "Tag v$tag != VERSION ($file)"; exit 1; }

      - name: Install mkcert (bundled into the app for HTTPS rewrites)
        run: brew install mkcert

      - name: Import the Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KP="$(openssl rand -hex 20)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize and staple the DMG
        env:
          SIGN_ID: "Developer ID Application: Simber Tech (BJ7A45T36J)"
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: ./make-dmg.sh

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Switcheroo-*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
